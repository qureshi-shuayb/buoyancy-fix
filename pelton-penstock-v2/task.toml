schema_version = "1.1"

[task]
name = "codimango/pelton-penstock-v2"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement Pelton turbine penstock head-loss and governor equilibrium solver. Given gross head, penstock geometry, nozzle parameters, compute net head via Darcy-Weisbach Colebrook-White fixed-point iteration, jet velocity, discharge, Pelton Euler power, and governor droop equilibrium speed after load step with deadband and rate limit."
authors = []
keywords = ["python", "hydropower", "pelton-turbine", "penstock", "darcy-weisbach", "colebrook-white", "governor", "droop-control", "steady-state", "mechanical-engineering"]

[metadata]
difficulty = "hard"
category = "feature-implementation"
category_usecase = "Simulation & Modeling"
category_subdomain = "Mechanical Engineering"
expert_time_estimate_min = 45.0
junior_time_estimate_min = 120.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
