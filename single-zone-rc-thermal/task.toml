schema_version = "1.1"

[task]
name = "codimango/single-zone-rc-thermal"
description = "Implement a single-zone lumped-capacitance (1R1C) building thermal model with a hand-rolled numerical integrator. Given outdoor temperature, internal gains, and HVAC input (scalar or per-step arrays), integrate C*dT_in/dt = (T_out - T_in)/R + Q_internal + Q_hvac over n_steps and return the indoor-temperature trajectory. The trap is numerical stability: naive forward Euler diverges when dt is comparable to the system time constant tau=R*C, so a correct solution must use a stable scheme (exact analytic update, implicit Euler, or sufficiently sub-stepped explicit method). Graded per-step against an independent analytic reference."
authors = []
keywords = ["numerical-methods", "ode", "thermal-model", "building-physics", "rc-circuit", "numerical-stability", "stiff", "python"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
expert_time_estimate_min = 30.0
junior_time_estimate_min = 90.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

