schema_version = "1.1"

[task]
name = "codimango/virtual-work-deflection-rust"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement Rust virtual work deflection calculator for planar truss. Compute member elongations, solve virtual unit load case via Gaussian elimination, sum virtual work to get joint deflection. Pure Rust stdlib, no external crates."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["rust", "structural-engineering", "truss", "virtual-work", "deflection", "civil-engineering", "statics"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
category_usecase = "compute_result"
category_subdomain = "scientific_computing"
expert_time_estimate_min = 50.0
junior_time_estimate_min = 130.0

[verifier]
timeout_sec = 300.0
[agent]
timeout_sec = 1800.0
[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
[verifier.env]
[environment.env]
[solution.env]
