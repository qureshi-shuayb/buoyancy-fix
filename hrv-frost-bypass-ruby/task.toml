schema_version = "1.1"

[task]
name = "codimango/hrv-frost-bypass-ruby"
description = "Implement pure-Ruby numerical model of heat recovery ventilator with frost control bypass damper, effectiveness derate, and supply temperature maintenance for commercial building ventilation. Difficulty in four interacting features not scaffolding: effectiveness derate non-linear with airflow ratio and temperature differential via NTU relation not constant; frost threshold dynamic depends on indoor humidity ratio which determines exhaust humidity requiring psychrometric saturation pressure calculation per occupancy state not fixed outdoor temp; bypass damper hysteresis state machine interacting with supply temperature maintenance triggering supplementary heater creating stateful coupling across hours; fan power rise non-linear with bypass position. Couplings interact so single-miss drifts past tight 0.25% tolerance on recovered energy and 2.5% on supplementary heating. Must handle 8760 and 8784 row CSVs skipping malformed rows."
authors = []
keywords = ["ruby", "hvac", "hrv", "psychrometrics", "numerical-methods", "bin-method", "frost-control", "feature-implementation"]

