schema_version = "1.1"

[task]
name = "codimango/vav-airhandler-control"
description = "Implement a Python day-long simulation of a multi-zone VAV (variable-air-volume) air handler whose energy and ventilation result depend on FOUR coupled controls: (1) an airside economizer that uses up to 100% outdoor air for free cooling when the outdoor dry-bulb is below a changeover high-limit, otherwise minimum OA; (2) a supply-air-temperature (SAT) reset that resets the coil-leaving setpoint between bounds against outdoor temperature, changing both coil load and box airflow; (3) VAV-box reheat with a minimum-airflow floor, so a box that throttles below its minimum must reheat to avoid overcooling (simultaneous cooling + reheat); and (4) CO2 demand-controlled ventilation (DCV) that raises the minimum outdoor-air fraction with occupancy, interacting with the economizer math and coil load while keeping zone CO2 under a limit. The simulator integrates a well-mixed zone CO2 mass balance with the exact analytic update, runs the coupled control logic per step, and reports fan, cooling-coil, and reheat electrical energy (kWh), total energy, the peak zone CO2 (ventilation adequacy), and the supply-airflow trajectory. Deterministic numeric grading against an independent reference; naive implementations (fixed minimum OA, no economizer, fixed SAT, no minimum-airflow reheat) drift well past tight tolerances."
authors = []
keywords = ["python", "simulation", "control-systems", "hvac", "vav", "air-handler", "economizer", "sat-reset", "reheat", "demand-controlled-ventilation", "co2", "energy", "numerical-integration"]

