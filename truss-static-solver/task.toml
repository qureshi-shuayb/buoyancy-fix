schema_version = "1.1"

[task]
name = "codimango/truss-static-solver-go"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement pure-Go planar truss static equilibrium solver using method of joints. Assemble equilibrium matrix, solve for member axial forces and support reactions via Gaussian elimination without numpy. Handles pinned and roller supports, determinate topology check."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "structural-engineering", "truss", "statics", "method-of-joints", "equilibrium", "linear-algebra", "gaussian-elimination"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
category_usecase = "compute_result"
category_subdomain = "scientific_computing"
expert_time_estimate_min = 45.0
junior_time_estimate_min = 120.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
