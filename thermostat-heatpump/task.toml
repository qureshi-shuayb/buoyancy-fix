schema_version = "1.1"

[task]
name = "codimango/thermostat-heatpump"
description = "Implement a Python day-long simulation of a single-zone (1R1C) building heated by a deadband/hysteresis thermostat driving an air-source heat pump whose COP varies with outdoor temperature, with a heat-pump capacity limit and backup resistance heat below the balance point. The simulator integrates the zone ODE with the exact analytic update, runs the on/off control state machine, accounts for heat-pump and backup electrical energy separately (COP interpolation; backup at COP=1), and reports total energy (kWh) and comfort violations (degree-hours outside the deadband). Deterministic numeric grading against an independent reference; naive implementations that drop hysteresis, use a fixed COP, or ignore the capacity-limit/backup logic fail."
authors = []
keywords = ["python", "simulation", "control-systems", "hvac", "heat-pump", "thermostat", "hysteresis", "state-machine", "numerical-integration", "energy"]

[metadata]
difficulty = "hard"
category = "feature-implementation"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 240.0

[verifier]
timeout_sec = 300.0

[agent]
