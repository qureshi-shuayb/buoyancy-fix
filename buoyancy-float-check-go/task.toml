schema_version = "1.1"

[task]
name = "shuaybqureshi/buoyancy-float-check-go"
description = "Two-step buoyancy task with hardening beyond textbook: Step1 basic float/sink/neutral via Archimedes; Step2 extends to prismatic, conical apex-down, and frustum (bucket) in UNIFORM fluid (linear, cbrt, cubic solver) PLUS hardest extension to STRATIFIED ocean where density rho(z)=SurfaceDensity+Gradient*z varies linearly with depth, so buoyant mass is integral ∫rho(z)*A(z)dz (quadratic for prismatic, quartic for conical/frustum) requiring derivation of cross-sectional area A(z) and numeric root-finding (binary search/Newton). Tests include reduction property Gradient=0 → uniform, frustum volume, frustum cubic vs stratified quartic, batch with invalid handling, and go vet. No formula spoilers given."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "buoyancy", "archimedes", "physics", "scientific_computing", "frustum", "stratified", "integral-buoyancy", "numeric_methods", "quartic"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

[metadata]
author_name = "Shuayb Qureshi"
author_email = "shuaybqureshi@meta.com"
difficulty = "hard"
