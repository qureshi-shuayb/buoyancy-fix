schema_version = "1.1"

[task]
name = "shuaybqureshi/buoyancy-float-check-go"
description = "Three-step buoyancy: Step1 basic float/sink/neutral via Archimedes with Tolerance (easy). Step2 extends to uniform fluid prismatic, conical apex-down, frustum (linear, cbrt, cubic solver) PLUS stratified ocean rho(z)=SurfaceDensity+Gradient*z where buoyant mass is integral BM=∫rho(z)A(z)dz (quadratic/quartic) requiring A(z) derivation. Step3 hardest compressible dynamics: hydrostatic pressure P(z)=rho integral = g(S z+0.5 G z²) (0.5 factor), bulk-modulus volume V(z)=V0*(1-P/K) clamped to MinVolumeFraction with crush handling, buoyant force rho(z)V(z)g, quadratic drag Fd=0.5 rho Cd Ad v|v|, terminal velocity, equilibrium depth solving M=rho(z)V(z) cubic/quadratic via bisection, and time-to-depth via RK4 integration, plus concurrent batch. Three-step structure gives learning gradient: Step1 easy, Step2 medium with G=0 reduction, Step3 ultra-hard with K∞ reduction. Tests include reduction checks, pressure 0.5 factor, volume clamping, crush, RK4 vs Euler 25% error detection, batch concurrent, go vet and go test -race."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "buoyancy", "archimedes", "physics", "scientific_computing", "frustum", "stratified", "compressible", "bulk-modulus", "drag", "terminal-velocity", "RK4", "concurrent", "integral-buoyancy", "quartic", "cubic"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

