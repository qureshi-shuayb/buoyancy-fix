schema_version = "1.1"

[task]
name = "shuaybqureshi/buoyancy-float-check-go"
description = "Three-step Go package building from tolerance-aware buoyancy to multi-geometry submersion and compressible dynamics. Step1 defines Tolerance=1e-9 neutral boundary and StandardGravity with validation substring requirements. Step2 extends to prismatic/conical/frustum bucket with linear radius interpolation r(z)=R1+(R2-R1)*z/H, stratified density rho(z)=S+G*z, buoyant mass integral BM(d) requiring derivation of A(z) per shape and bisection solving, with bespoke reductions G=0→uniform within 1e-6 and R1==R2 cylinder / R1==0 cone. Step3 adds MinimumVolumeFraction=0.1 clamped compression, crush handling with 90% threshold and 'crush' error substring, Ad(z)=V(z)/Height reference area, drag opposing motion with 'drag' substring, DiveResult with CrushRisk and Index order preservation, and concurrent batch requiring explicit nil→non-nil empty slice and sync.WaitGroup+Mutex race-free. Tests cover tolerance boundaries 0.9*Tol vs 1.1*Tol, non-linearity traps, reduction properties, pressure integration vs naive multiplication, clamping, sign handling, Euler vs 4th-order accuracy gating, order preservation, vet, and race."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "buoyancy", "archimedes", "physics", "scientific_computing", "frustum", "stratified", "compressible", "bulk-modulus", "drag", "terminal-velocity", "RK4", "concurrent", "integral-buoyancy", "quartic", "cubic"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

