schema_version = "1.1"

[task]
name = "shuaybqureshi/buoyancy-float-check-go"
description = "Bespoke Go package 'buoyancy' with concise API contracts (<120 lines per milestone). Step1: core buoyancy with Tolerance=1e-9, Cylinder V=πr²h Pi, Sphere 4/3πr³, ApparentWeight and Ballast with tolerance-zeroing (0.9*Tol→0), BatchCheckBuoyancy concurrent with WaitGroup+Mutex race-free, overflow post-op IsInf. Step2: partial submersion for prismatic, conical (cbrt), frustum (r(z)=R1+(R2-R1)z/H, Vol πH/3(R1²+R1R2+R2²)), stratified rho(z)=S+G*z, BM(d)=∫rhoA dz with direct BuoyantMass methods exposing 0.5, 1/3, 1/4, R1*R2 coefficients, equilibrium via bisection, reductions G=0→uniform 1e-6, R1==R2 cylinder, R1==0 cone, concurrent BatchAnalyze race-free. Step3: compressible P(z)=g(Sz+0.5Gz²), V(z)=V0(1-P/K) clamped to MinimumVolumeFraction=0.1, crush 90%, Ad=V/H, drag 0.5*rho*Cd*Ad*v*|v|, terminal velocity, equilibrium via bisection, time-to-depth RK4 with depth clamping and ±15% vs dt/10, concurrent batch WaitGroup+Mutex race-free. Distinctive identifiers zero hits in public search."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "buoyancy", "bespoke-package", "package-defined", "FrustumObject", "StratifiedFluid", "DiveResult", "MinimumVolumeFraction", "CrushDepth", "CompressibleObject", "CylinderObject", "SphereObject", "BuoyancyReport", "ApparentWeight", "RequiredBallastMass", "BatchCheckBuoyancy", "BuoyantMass", "integral-buoyancy", "quartic", "cubic", "Ad=V/H", "crush-threshold", "nil-non-nil", "race-detector", "tolerance-constant", "Pi-factor", "overflow-detection", "tolerance-zeroing", "concurrent-batch"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

