schema_version = "1.1"

[task]
name = "shuaybqureshi/buoyancy-float-check-go"
description = "Ultra-hard two-step buoyancy: Step1 basic float/sink/neutral via Archimedes with Tolerance. Step2 extends to prismatic, conical apex-down, frustum in uniform fluid (linear, cbrt, cubic solver) PLUS stratified ocean rho(z)=SurfaceDensity+Gradient*z where buoyant mass is integral ∫rho(z)A(z)dz (quadratic/quartic) requiring A(z) derivation, PLUS hardest compressible dynamics: hydrostatic pressure P(z)=∫rho(z')g dz' = g(S z+0.5 G z²) (0.5 factor trap), bulk-modulus volume V(z)=V0*(1-P/K) clamped to MinVolumeFraction with crush handling, buoyant force rho(z)V(z)g, quadratic drag Fd=0.5 rho Cd Ad v|v| with sign trap, terminal velocity sqrt(2|Fw-Fb|/(rho Cd Ad)), equilibrium depth solving M=rho(z)V(z) cubic/quadratic via bisection, and time-to-depth via RK4 integration of ODE dv/dt=(Fw-Fb-Fd)/M, dz/dt=v with interpolation, plus concurrent batch with order preservation and race-free. No formulas given, requires deriving pressure integral, compression, drag sign, RK4 steps. Tests include reduction K→∞→stratified, G=0→uniform, pressure 0.5 factor, volume clamping, crush, RK4 vs Euler 25% error detection, batch concurrent, go vet and go test -race."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "buoyancy", "archimedes", "physics", "scientific_computing", "frustum", "stratified", "compressible", "bulk-modulus", "drag", "terminal-velocity", "RK4", "concurrent", "integral-buoyancy", "quartic", "cubic"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

