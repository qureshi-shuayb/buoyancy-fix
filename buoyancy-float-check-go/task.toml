schema_version = "1.1"

[task]
name = "shuaybqureshi/buoyancy-float-check-go"
description = "Three-step buoyancy physics in Go: Step1 basic float/sink/neutral via Archimedes with tolerance handling. Step2 uniform fluid prismatic, conical apex-down, frustum with non-linear depth relations plus stratified ocean rho(z)=SurfaceDensity+Gradient*z where buoyant mass is integral BM=∫rho(z)A(z)dz requiring derivation of A(z) for each geometry and bisection root-finding. Step3 compressible dynamics with hydrostatic pressure from density integral, bulk-modulus compression with clamping and crush handling, buoyant force dependent on compressed volume, quadratic drag opposing motion, terminal velocity, equilibrium depth via bisection for M=rho(z)V(z), and time-to-depth via RK4 integration of coupled ODE with interpolation plus concurrent batch with order preservation and race-free implementation. Tests include G=0 and K-infinity reduction properties, pressure integration correctness, volume clamping, crush handling, drag sign, RK4 vs Euler discrimination, batch order, go vet and go test -race."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "buoyancy", "archimedes", "physics", "scientific_computing", "frustum", "stratified", "compressible", "bulk-modulus", "drag", "terminal-velocity", "RK4", "concurrent", "integral-buoyancy", "quartic", "cubic"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

