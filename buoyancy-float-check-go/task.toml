schema_version = "1.1"

[task]
name = "shuaybqureshi/buoyancy-float-check-go"
description = "Bespoke three-step Go package 'buoyancy' with package-defined conventions building from HARDENED tolerance-aware buoyancy to multi-geometry submersion and compressible dynamics. Distinctive identifiers FrustumObject, StratifiedFluid, DiveResult, MinimumVolumeFraction, CrushDepth, CompressibleObject, CylinderObject, SphereObject, BuoyancyReport returned zero hits in public Go search. Step1 HARDENED SIGNIFICANTLY: defines package invariant Tolerance=1e-9 neutral boundary requiring constant reference via AST in three functions (CheckBuoyancyByDensity, ApparentWeight, RequiredBallastMass), StandardGravity must NOT be used in BuoyantForce, WeightForce, ApparentWeight, RequiredBallastMass, BatchCheckBuoyancy (g param Mars 3.7 trap), Height field inverse trap (Density must NOT check Height), plus new cylindrical geometry V=πr²h Pi trap (R=1 H=1 → π not 1, diameter vs radius 4x) and spherical V=4/3πr³ 4/3 trap (R=1 → 4.18879 not 3.14), inverse DRY traps (Cylinder Volume must NOT check Mass, Sphere Volume must NOT check Mass), apparent weight with tolerance-zeroing (neutral within Tol → exactly 0 not epsilon) and ballast with same zeroing, batch ordering with Index preservation, nil→non-nil empty slice via make(...,0), invalid State handling, and overflow detection post-op IsInf/IsNaN for all multiplications/divisions (1e200*1e200 must error not Inf). Step2 extends to prismatic, conical apex-down cbrt non-linear 0.125→0.5H, frustum bucket r(z)=R1+(R2-R1)z/H with Pi and R1*R2 cross-term traps, stratified rho(z)=S+G*z, BM(d)=∫rhoA dz yielding quadratic/cubic/quartic with 0.5 factor trap, reductions G=0→uniform 1e-6, R1==R2 cylinder, R1==0 cone. Step3 adds MinimumVolumeFraction=0.1 constant ref, clamped compression V=V0(1-P/K) with clamping, crush 90% threshold, pressure integral P=g(Sz+0.5Gz²) 0.5 factor, Ad=V/H bespoke, drag v*|v| sign, DiveResult CrushRisk, concurrent batch WaitGroup+Mutex race-free, nil handling. Tests cover tolerance 0.9/1.1 Tol, Pi missing, 4/3 missing, diameter confusion, linear vs cbrt/cubic, G=0 reduction, pressure 0.5 factor >1% error, clamping, sign, overflow, batch order, race, vet. Novel composition with bespoke Ad, crush 90%, batch ordering."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "buoyancy", "bespoke-package", "package-defined", "FrustumObject", "StratifiedFluid", "DiveResult", "MinimumVolumeFraction", "CrushDepth", "CompressibleObject", "CylinderObject", "SphereObject", "BuoyancyReport", "ApparentWeight", "RequiredBallastMass", "BatchCheckBuoyancy", "integral-buoyancy", "quartic", "cubic", "Ad=V/H", "crush-threshold", "nil-non-nil", "race-detector", "tolerance-constant", "Pi-factor", "overflow-detection", "tolerance-zeroing", "inverse-trap", "diameter-vs-radius"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

