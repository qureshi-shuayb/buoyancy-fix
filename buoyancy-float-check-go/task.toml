schema_version = "1.1"

[task]
name = "shuaybqureshi/buoyancy-float-check-go"
description = "Bespoke three-step Go package 'buoyancy' with package-defined conventions (not generic textbook) building from tolerance-aware buoyancy to multi-geometry submersion and compressible dynamics. Distinctive identifiers FrustumObject, StratifiedFluid, DiveResult, MinimumVolumeFraction, CrushDepth, CompressibleObject returned zero hits in public Go search, confirming novel composition. Step1 defines package invariant Tolerance=1e-9 neutral boundary (|rho_obj - rho_fluid| <= Tolerance) requiring constant reference via AST, and StandardGravity with validation substring and Height field package requirement for later A(z) derivation. Step2 extends to prismatic (A=Vol/Height constant), conical apex-down (similar cones non-linear cbrt), frustum bucket with package-defined linear radius interpolation r(z)=R1+(R2-R1)*z/H, stratified density rho(z)=S+G*z package-defined, buoyant mass integral BM(d)=∫rho(z)A(z)dz requiring per-shape A(z) derivation yielding polynomial orders up to quartic (cubic for conical, quartic for frustum) and monotonic root-finding, with bespoke reductions G=0→uniform within 1e-6 and R1==R2 cylinder linear / R1==0 cone. Step3 adds package constant MinimumVolumeFraction=0.1 requiring constant reference, clamped linear compression V(z)=V0*(1-P/K) with clamping to MinVol, crush handling with 90% threshold and 'crush' error substring, pressure integral P(z)=g*(S*z+0.5*G*z^2) derived from integral (not naive rho*g*z), bespoke reference area Ad(z)=V(z)/Height (not standard cross-section), drag opposing motion via v*|v| with 'drag' substring and sign handling, DiveResult with CrushRisk and Index order preservation, and concurrent batch requiring explicit nil→non-nil empty slice via make(...,0) and sync.WaitGroup+Mutex race-free. Tests cover tolerance boundaries 0.9*Tol vs 1.1*Tol, non-linearity traps (linear vs cbrt/cubic), reduction properties, pressure integration vs naive multiplication >1% error, clamping to MinimumVolumeFraction, sign handling, Euler vs 4th-order weighted accuracy gating ±15% vs dt/10 with depth clamping during sub-steps, order preservation, vet, and race. This specific multi-geometry/multi-regime package with bespoke Ad, crush 90%, and concurrent ordering is original."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "buoyancy", "bespoke-package", "package-defined", "FrustumObject", "StratifiedFluid", "DiveResult", "MinimumVolumeFraction", "CrushDepth", "CompressibleObject", "integral-buoyancy", "quartic", "cubic", "Ad=V/H", "crush-threshold", "nil-non-nil", "race-detector", "tolerance-constant"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

