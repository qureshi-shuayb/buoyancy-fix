schema_version = "1.1"

[task]
name = "codimango/economizer-enthalpy-php"
description = "Implement pure-PHP numerical model of air-side economizer with enthalpy-based switchover control sensor fault bias integrated blending and low-ambient lockout for commercial building AHU. Difficulty in four interacting features not scaffolding: enthalpy calculation requires psychrometric saturation pressure via ASHRAE Hyland-Wexler two-branch log-polynomial with over-ice branch below 0C then humidity ratio then moist air enthalpy formula; sensor fault bias shifts perceived outdoor enthalpy used for control decision but true enthalpy must be used for energy calculation split; integrated economizer blending non-linear dependent on enthalpy differential and damper position limit allowing simultaneous economizer and mechanical cooling; low ambient lockout disables economizer below cutout temperature forcing mechanical cooling even when enthalpy favorable. Couplings interact so single-miss drifts past tight 0.25% tolerance on net savings. Must handle 8760 and 8784 row CSVs skipping malformed rows."
authors = []
keywords = ["php", "hvac", "economizer", "psychrometrics", "numerical-methods", "sensor-fault", "feature-implementation"]

