description = "v2 clean scaffold redo. Implement Python day-long simulation of single-zone 1R1C building heated by deadband hysteresis thermostat driving air-source heat pump with three interacting realism effects: anti-short-cycle minimum compressor runtime off-time overriding deadband, periodic defrost cycles inside defrost band with no useful heat degraded COP backup fills gap, and part-load cycling degradation PLF = 1 - Cd*(1-PLR) on effective COP. Heat pump capacity limit plus backup resistance heat COP 1 cover shortfall including defrost. Simulator integrates zone ODE with exact analytic update, runs coupled control defrost part-load state machine, accounts heat pump defrost backup electricity, reports total energy kWh and comfort degree-hours outside deadband. Deterministic numeric grading against independent reference; naive implementations drift past tight tolerances."
