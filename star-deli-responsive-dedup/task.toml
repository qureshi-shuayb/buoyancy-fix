schema_version = "1.1"

[task]
name = "codimango/star-deli-responsive-dedup"
description = "Refactor a webpage whose markup and CSS are hand-duplicated four times (one block per breakpoint: mobile/tablet/laptop/desktop, toggled by display:none) into a single responsive block driven by media queries, preserving identical rendering at every breakpoint."
authors = []
keywords = ["html", "css", "frontend", "web-frontend", "responsive", "refactoring", "media-queries", "dry"]

[metadata]
difficulty = "medium"
category = "refactoring"
expert_time_estimate_min = 25.0
junior_time_estimate_min = 60.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
