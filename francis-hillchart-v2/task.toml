schema_version = "1.1"

[task]
name = "codimango/francis-hillchart-v2"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement Francis turbine hill-chart interpolation and best efficiency point solver. Given head, power request, and hill chart points [Q11,n11,eta], find discharge Q, speed n, and efficiency eta meeting power target within operating limits and cavitation sigma constraint using barycentric interpolation on Delaunay triangulation and golden-section search."
authors = []
keywords = ["python", "hydropower", "francis-turbine", "hill-chart", "interpolation", "barycentric", "delaunay", "golden-section", "cavitation", "simulation-modeling"]

[metadata]
difficulty = "hard"
category = "feature-implementation"
category_usecase = "Simulation & Modeling"
category_subdomain = "Mechanical Engineering"
expert_time_estimate_min = 60.0
junior_time_estimate_min = 150.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
