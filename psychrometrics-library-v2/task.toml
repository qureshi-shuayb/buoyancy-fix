schema_version = "1.1"

[task]
name = "codimango/psychrometrics-library-v2"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement a dependency-free Python psychrometrics library (SI units) exposing saturation vapor pressure with task-specified enhancement factor f_e(t)=1+A+B*t+C*t^2, humidity ratio, relative humidity, dew point, moist-air enthalpy, and iteratively-solved wet-bulb at configurable pressure. Enhancement factor is non-canonical and defined only in spec, forcing spec-following over recall. Outputs graded against ASHRAE base plus enhancement across grid including saturated, very-dry, altitude; wet-bulb has no closed form; solution may not wrap psychrometrics library."
authors = []
keywords = ["python", "psychrometrics", "hvac", "numerical-methods", "root-finding", "ashrae", "feature-implementation", "spec-following"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
expert_time_estimate_min = 60.0
junior_time_estimate_min = 180.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
