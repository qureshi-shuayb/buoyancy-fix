schema_version = "1.1"

[task]
name = "codimango/psychrometrics-library-v2"
description = "Implement a dependency-free Python psychrometrics library (SI units) exposing saturation vapor pressure, humidity ratio, relative humidity, dew point, moist-air enthalpy, and an iteratively-solved wet-bulb temperature at a configurable atmospheric pressure. Outputs are graded against an independent ASHRAE-based reference (psychrolib) across a grid of temperatures, humidities, and pressures including saturated, very-dry, and altitude edge cases; the wet-bulb solve has no closed form and the solution may not wrap a psychrometrics library."
authors = []
keywords = ["python", "psychrometrics", "hvac", "numerical-methods", "root-finding", "ashrae", "feature-implementation"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
expert_time_estimate_min = 60.0
junior_time_estimate_min = 180.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
