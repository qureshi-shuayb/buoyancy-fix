schema_version = "1.1"

[task]
name = "codimango/flash-separator-surface-v1"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement Python isenthalpic flash separator model for geothermal surface brine using Antoine equation solved via Newton-Raphson 31 iterations for saturation temperature, four-stage cascade mass-energy balance, Souders-Brown carryover correlation, and silica kinetic precipitation ODE explicit Euler 10 substeps. Returns final steam/brine flows, quality, brine enthalpy, scaling risk, stage1/stage2/stage3/stage4 separated flows, silica concentration time series length 4, T_sat trajectory length 4. Total 16 output keys with tightened 1e-16 tolerance. Deterministic numeric grading against independent reference; naive implementations using closed-form Antoine inversion, constant carryover, single or two or three stage only, equilibrium silica only, or omitting Newton iterations fail tightened 1e-16 tolerances across normal, subcooled, superheated, scaling, low pressure, carryover sensitivity, four-stage cascade, and kinetic silica scenarios."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["python","simulation","geothermal","flash-separator","antoine","newton-raphson","thermodynamics","silica-scaling","mass-balance","energy-balance","four-stage","souders-brown","kinetics"]

[metadata]
difficulty = "hard"
category = "feature-implementation"
category_usecase = "compute_result"
category_subdomain = "scientific_computing"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 270.0

[verifier]
timeout_sec = 300.0
[agent]
timeout_sec = 1800.0
