schema_version = "1.1"

[task]
name = "codimango/pwr-primary-loop-v2"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement Python lumped-parameter PWR primary loop simulation with core heat source, steam generator heat sink, pressurizer pressure control, pump coastdown and natural circulation transition. Explicit Euler for temperatures and pressurizer, algebraic Newton solve for flow each step balancing pump head plus buoyancy against loop resistance. Returns core outlet temperature, SG outlet temperature, flow, pressure trajectories, peak temperature and minimum flow. Deterministic numeric grading against independent reference with per-signal tolerances graded on deviation not absolute 5%: 5K temperature, 80kPa pressure, 5% flow; naive implementations omitting natural circulation head, pressurizer coupling, LMTD SG model, or decay heat curve fail across 7 distinct scenarios: steady state normal operation, pump trip coastdown to natural circulation, steam demand step down, loss of feedwater heating, pressurizer heater/spray deadband exercise, decay heat constant-fraction branch, and LMTD high-ratio SG model."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["python","simulation","nuclear","pwr","thermal-hydraulics","natural-circulation","pressurizer","pump","steam-generator","lumped-parameter"]

[metadata]
difficulty = "hard"
category = "feature-implementation"
category_subdomain = "scientific-simulation"
category_usecase = "numerical-modeling"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 240.0

