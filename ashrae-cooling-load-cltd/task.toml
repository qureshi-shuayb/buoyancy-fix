schema_version = "1.1"

[task]
name = "codimango/ashrae-cooling-load-cltd"
description = "Implement a dependency-free Python function that computes a building's peak design cooling load using the ASHRAE CLTD/SCL/CLF (cooling-load temperature difference / solar cooling load / cooling-load factor) method. The function receives a building envelope (opaque surfaces, glazing), internal loads, ventilation, and the full set of ASHRAE design tables (CLTD, SCL, CLF, latitude-month, color factors, hourly outdoor profile), and must convert instantaneous heat gains into the actual hourly cooling load — applying the CLTD design-condition/LM/color corrections to opaque and glass conduction, SC*SCL for solar through glass, and the cooling-load factor (CLF) to internal gains — then return the peak total over the 24-hour day. Graded against an independent ASHRAE reference across several buildings plus a randomized scenario; a naive instantaneous heat-gain sum (U*A*dT + raw solar + raw internal) misses the thermal-lag machinery and fails the tolerances."
authors = []
keywords = ["python", "ashrae", "hvac", "cooling-load", "cltd", "thermal-mass", "building-physics", "feature-implementation"]

