schema_version = "1.1"

[task]
name = "codimango/psychro-process-sim"
description = "Implement a psychrometric process simulator driven by a tiny text DSL. The agent writes a parser and state machine in /app/process_sim.py that runs a sequence of moist-air process commands (set/heat/cool/humidify/mix) over a moist-air state and reports the final air state (dry-bulb, humidity ratio, relative humidity, enthalpy) plus cumulative sensible energy, latent energy and total water added. No psychrometrics library implements this DSL, so it cannot be one-shot recalled; the difficulty is the parser plus the process-by-process energy/mass bookkeeping (isothermal humidification adds latent energy, sensible heating lowers relative humidity, and stream mixing must use an enthalpy/humidity-ratio balance rather than a linear temperature average). Outputs are graded against an independent in-task oracle across several DSL programs including whitespace/comment edge cases and multiple mixes."
authors = []
keywords = ["python", "parser", "state-machine", "dsl", "psychrometrics", "hvac", "energy-balance", "feature-implementation"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
expert_time_estimate_min = 60.0
junior_time_estimate_min = 180.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
