schema_version = "1.1"

[task]
name = "codimango/psychro-process-sim"
description = "Implement an interpreter for PsychroLang, a small imperative programming language that drives a moist-air psychrometric state machine, in /app/process_sim.py exposing simulate(program: str) -> dict. The agent must build a real tokenizer + recursive-descent parser + tree-walking interpreter (not a line/regex parser): named variables (let), arithmetic expressions over live state accessors (t_db/w/rh/h and the accumulators), comparisons and and/or/not, control flow with brace-delimited blocks (if/else, repeat N, while), plus the psychrometric process statements (set/heat/cool/cool-sat/humidify/mix/process/recirc). Two constructs are implicit equations that must be solved numerically: 'recycle frac { body }' blends a fraction of the block output back into the block input, so the recycle stream must be iterated to a fixed point (a single pass is wrong) with accumulators committed on exactly one converged pass; and 'control heat|humidify to rh|h = expr' must root-find the actuator amount to hit a target metric (heat-to-rh is transcendental in the ASHRAE saturation correlation, so there is no closed form). Carried-over correctness: cool-sat condenses water (clamp to saturation, negative signed water/latent), process is order-dependent sensible-then-(de)humidify, mix/recirc are enthalpy/humidity-ratio balances, recirc/recycle blend with the original supply state captured at set. The interpreter strips inline comments, treats newlines/semicolons as insignificant, and raises on malformed or out-of-order programs. Outputs are graded against an independent in-task oracle (a full second interpreter, no psychrometrics library) under tight tolerances across programs exercising loops, conditionals, the fixed-point recycle, and the root-finding control."
authors = []
keywords = ["python", "interpreter", "parser", "recursive-descent", "control-flow", "fixed-point", "root-finding", "state-machine", "dsl", "psychrometrics", "hvac", "energy-balance", "feature-implementation"]

