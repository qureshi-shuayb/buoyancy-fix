schema_version = "1.1"

[task]
name = "codimango/orc-binary-cycle-v1"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement Python Organic Rankine Cycle binary geothermal simulation with R245fa property table loaded from CSV file at /app/r245fa_properties.csv requiring file IO parsing and linear interpolation, preheater evaporator superheater pinch constraint solved via bisection 31 iterations hardened v9 when target UA provided else clamp fallback, turbine and pump efficiencies, LMTD UA sizing with separate UA_sh UA_ev UA_ph UA_recuperator outputs totaling 11 keys including UA_recuperator coefficient 0.137 explicitly pinned, recuperator option boolean adding heat exchanger effectiveness 0.8, part-load curve across 11 brine flow fractions explicit [0.15,0.3,0.45,0.6,0.75,0.85,1.0,1.15,1.3,1.45,1.6], and exergy destruction. Deterministic stdlib-only model graded against independent reference across brine temperature, pinch, efficiency, condenser, recuperator, and part-load scenarios; naive implementations omitting CSV parsing, bisection, recuperator branch, part-load loop, LMTD edge handling, property interpolation, or exergy formula fail tightened tolerances v9 to 5e-7 rel 1e-4 abs power UA and 2e-7 for efficiency."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["python","simulation","orc","geothermal","thermodynamics","heat-exchanger","pinch","lmtd","r245fa","binary-cycle","exergy","bisection","recuperator","part-load","csv"]

