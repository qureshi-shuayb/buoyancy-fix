schema_version = "1.1"

[task]
name = "codimango/degree-day-energy-v2"
description = "Implement a pure-Python tool that estimates a building's annual heating/cooling electricity (kWh) from a year of hourly outdoor temperatures. The difficulty is in four INTERACTING features, not scaffolding: (1) a temperature-BIN method (energy per bin, per occupancy state, evaluated at the bin center); (2) a time-varying occupied/unoccupied SETBACK schedule so the derived heating and cooling balance points change by hour-of-day; (3) PART-LOAD / temperature-dependent equipment — a heat-pump COP curve with electric-resistance backup below a lockout temp, and a temperature-dependent cooling COP — both linearly interpolated per bin; and (4) an ECONOMIZER that meets cooling with free outdoor air (zero compressor electricity) for cooling bins below the changeover temp. The couplings interact (setback shifts which hours need heating vs free cooling vs compressor cooling; backup engages only below the schedule-dependent regime; economizer availability depends on the active cooling balance point), so a solution that handles a single feature but misses an interaction drifts past a tight 0.2% tolerance. The tool must also handle 8760- vs 8784-row (leap) files and skip malformed CSV rows."
authors = []
keywords = ["python", "energy-modeling", "bin-method", "hvac", "heat-pump", "setback-schedule", "economizer", "cop-interpolation", "part-load", "csv-parsing", "unit-conversion", "feature-implementation"]

[metadata]
difficulty = "hard"
category = "feature-implementation"
expert_time_estimate_min = 60.0
junior_time_estimate_min = 150.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

