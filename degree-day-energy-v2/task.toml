schema_version = "1.1"

[task]
name = "codimango/degree-day-energy-v2"
description = "v2 clean scaffold redo. Pure-Python annual building heating cooling electricity estimator kWh from hourly outdoor temperatures. Four interacting features: temperature bin method per occupancy state evaluated at bin center, time-varying setback schedule shifting balance points by hour of day, part-load temperature-dependent heat pump COP curve with electric resistance backup below lockout and cooling COP curve interpolated per bin, economizer free cooling below changeover temperature zero compressor electricity. Couplings cause >4x 0.5% drift if any feature missed. Must handle 8760 and 8784 row CSVs skipping malformed rows."
