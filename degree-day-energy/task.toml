schema_version = "1.1"

[task]
name = "codimango/degree-day-energy"
description = "Implement a Python tool that parses a year of hourly outdoor temperatures from CSV, computes heating and cooling degree days (HDD/CDD) against a configurable balance-point temperature, and estimates annual heating and cooling energy (kWh) from the building UA value and equipment efficiency (heating COP/AFUE and cooling COP). The hard parts are per-hour (not per-day) degree-day accumulation, the degree-hours-to-degree-days unit conversion, the UA-driven thermal-energy formula, and dividing thermal load by the correct efficiency to get delivered electricity."
authors = []
keywords = ["python", "energy-modeling", "degree-days", "hvac", "csv-parsing", "unit-conversion", "feature-implementation"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
expert_time_estimate_min = 45.0
junior_time_estimate_min = 120.0

