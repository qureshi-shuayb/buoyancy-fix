schema_version = "1.1"

[task]
name = "codimango/vav-terminal-reheat-go"
description = "Implement pure-Go numerical model of VAV terminal unit with pressure-dependent airflow, reheat coil staging, and duct static pressure reset for commercial building. Difficulty in four interacting features not scaffolding: pressure-dependent airflow solved from damper authority curve vs available static each hour not commanded directly; static pressure reset schedule based on warmest zone demand changing available static by hour; reheat hot-water coil staging interacting with minimum airflow setpoint balancing fan savings vs reheat penalty; coil effectiveness non-linear with water flow via NTU relation not proportional to valve command. Couplings interact so single-miss drifts past tight 2% tolerance. Must handle 8760 and 8784 row CSVs skipping malformed rows."
authors = ["Shuayb Qureshi"]
keywords = ["go", "hvac", "vav", "numerical-methods", "bin-method", "pressure-flow", "reheat", "feature-implementation"]

[metadata]
difficulty = "hard"
category = "feature-implementation"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 240.0

