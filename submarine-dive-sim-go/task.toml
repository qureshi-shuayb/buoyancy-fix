schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "Two-step submarine buoyancy simulator with depth-dependent ocean stratification, compressible hull, quadratic drag, equilibrium root-finding via bisection, RK4 time-to-depth integration, and concurrent fleet analysis reusing same Go package."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "RK4", "concurrency"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

[metadata]
author_name = "Shuayb Qureshi"
author_email = "shuaybqureshi@meta.com"
difficulty = "hard"
category = "iterate_on_feature"
category_usecase = "compute_result"
category_subdomain = "scientific_computing"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 180.0
reward_type = "binary"
tags = ["multi-turn", "context-following", "submarine", "physics", "go", "simulator", "numerical-methods", "root-finding", "RK4", "concurrency", "hydrostatics", "drag"]
languages = ["go"]

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[environment.env]
[solution.env]

[[steps]]
name = "1_basic_buoyancy_control"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1200.0

[[steps]]
name = "2_dive_dynamics"
dependencies = ["1_basic_buoyancy_control"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1200.0
