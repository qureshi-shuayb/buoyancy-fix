description = "ULTRA-ULTRA-HARD Step1 44 constants (36+8: QuadrupleCabbelingCoeff 0.0009, CompensatedLayerCoeff 0.00006, ThermohalineIntrusionScale 22, BaroclinicShearCoeff 0.00004, ThermostericSecondOrderCoeff 2.5e-7, HalostericSecondOrderCoeff 1.2e-7, SoundSpeedDepthCubeCoeff 2e-9, PressureCubicNonLinearCoeff 7e-16), density 25 terms rho0+grad*z+3 pycno+beta*s+gamma*t*(1+Gamma*z)+4 cab+2 quad+2 cubic s2t st2+2 triple + thermo/halo/vort +5 new quad s2t2, compensated p1p2s, baroclinic z*s*t*(1-expI), thermoSecond t*z2, haloSecond s*z2, 22 exponential scales (200,45,90,30,120,24,22.5,26.08,32.72,75,18,15.65,21.42,13.33,20,15,60,18,36.73,16.51,12,11.47,10.86) plus z*exp, z2*exp, z*product, z2*product integrals via generic subset enumeration 2^k up to 16 masks, pressure 26-term analytic integralProduct and integralZProduct and integralZ2OneMinusExp, Simpson 500k rel 1e-6 missing any >30, derivatives up to 5th analytic via mul2 Leibniz h=0.001 tol 1e-8/1e-7/1e-6/1e-5/1e-4, cabbeling includes quadruple+compensated, sound speed depth-cubed z3 + T3 + S3 + Quad*T*(S-35)+ThermoSecond*T2+HaloSecond*S2 + P*T + P2*T + z*P couplings, gradient 11 terms + curvature second derivative, potential temp 4th order x4 + z2 lapse, steric P2+P3 correction, volume P3 + thermal-pressure cross Comp*dT*P, bulk modulus K=1/(k-2*Pn*P-3*Pc*P2-Comp*dT), 7 finders via 3000 pts Brent 200 iter SOFAR/pycnocline/spice/double-diffusive + thermocline/halocline/compensated layer root beta*dS+gamma*dT, N2 acoustic correction g/rho*(drho/dz - rho*g/c2) + gradient, PV, Turner, regime, spiciness curvature+torsion. Step2 SUPER-HARD 10-pt Re log-interp Cd table, implicit terminal Brent coupled Cd(Re(v)), equilibrium 2000 pts Brent 150 iter stability FPrime<0, adaptive Dormand-Prince RK45 atol 1e-6 rtol 1e-5 PI control, dive profile ComputeDiveProfile, priority fleet heap by effective density + bounded pool 4 + atomic max concurrency + deadline 20ms + cancellation during flight 5ms."
