[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "Super-hard Step1 outcome-specified with explicit constant mapping and full closed-form pressure: 26 constants (CabbelingCoeff 0.06, HullThermalExpansionQuadCoeff 1.2e-6, SoundSpeedPressureQuadCoeff 1.2e-5, ThermobaricCoeff 0.5, ThermalCouplingCoeff 0.15, GammaDepthFactor 0.0001, TAnomQuadCoeff 0.002, SAnomQuadCoeff 0.01), density rho0+grad*z+3 pycno+beta*sAnom+gamma0*tAnom*(1+gDepth*z)+Cc*sAnom*tAnom+Cc*pyc3*sAnom+Cc*pyc1*sAnom+Cc*pyc2*tAnom+Tquad*tAnom^2+Squad*sAnom^2 with 11 exponential scales (200,45,90,30,120,24,22.5,26.08,32.72,60,15) plus z*exp Ts*z*exp, explicit mapping PycnoclineDelta=10 S=200 etc, pressure complete closed-form with quadratic 0.5*grad*z^2+0.5*gamma0*gDepth*12*z^2+5 base saturation Di*(z+Si*exp-Si)+mixed Smix24,Smix22_5,SmixS1_Hs,SmixS2_Ts+double-freq Hs/2,Ts/2+z*exp, gradient h=0.01 tol 1e-6, second/third derivative, cabbeling parameter, spiciness, sound speed quad, gradient, SOFAR axis scanning 1000+ternary, pycnocline max gradient, potential density, potential temperature second-order, Brunt-Vaisala, Turner angle, double-diffusive regime, steric height, volume quad thermal. Step2: simple Re table Cd 1.2/0.5/0.2, fixed RK4 5% tol, terminal bisection, multi-root equilibrium scanning 0.5m, bounded worker-pool fleet 20 order preserved."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "RK4", "concurrency", "pycnocline", "triple-pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "turner-angle", "salinity", "sound-speed", "potential-density", "second-derivative", "reynolds", "multi-root", "worker-pool", "cabbeling", "SOFAR", "spiciness", "steric-height", "mixed-exponential", "depth-dependent-gamma", "third-derivative", "quad-anomaly", "explicit-mapping", "closed-form-pressure"]
