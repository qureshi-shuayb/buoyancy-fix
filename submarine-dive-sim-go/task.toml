schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "TRIVIAL 3-step split to hit 10-30% fail rate (was 0/10 at 683b3c3 8 consts 2-term). Step1a 1_ocean_constants_and_density: 4 required constants (Tolerance 1e-9, Gravity 9.81, SeawaterDensity 1025, MinVol 0.1) allow extras, density constant rho0=fluid.Density, gradient 0, salinity 35, temp 15 constant, validation, EffectiveMass/Density, 60-100 lines, tests: constants 4 exact allow extras, density constant 10% tol, gradient 0 tol 1e-2. Step1b 2_pressure_sound_finders: reuses 4 required, adds pressure 1-term g*rho0*z (explicit snippet), volume exp(-kP) clamped 0.1 no thermal, sound constant 1500 any 1400-1600 range, SOFAR any depth [0,maxDepth] via 10pts scan, 80-120 lines, tests: pressure 10k rel 10% loose, sound range, finder any depth. Step3 3_dive_dynamics: reuses 4 required, 5-pt Re Cd table [1e3,1e4,1e5,1e6,5e6] Cd [1.44,1.2,0.7,0.2,0.12] log-interp band 0.1 midpoint 0.05, terminal Brent 50iter 1e-2, equilibrium 500pts 50iter root 5m via compression (k>0) for constant density float->sink, fixed RK4 k1..k4 + optional adaptive atol/rtol ref 25%, DiveProfile len>3 depth 5%, priority heap + bounded pool 4 + atomic any width/style (AddInt32/64, Uint, typed Int32/64) behavioral <=4, deadline 500ms/50items lenient, cancel 200ms/50items lenient, R05 leak fixed rm before+after, R08 atomic any width."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "concurrency", "salinity", "sound-speed", "potential-density", "first-derivative", "reynolds", "multi-root", "worker-pool", "SOFAR", "steric-height", "closed-form-pressure", "trivial", "3-step-split", "information-isolation-fix", "atomic-alternatives"]
