schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "Ultra-hard Step1 outcome-specified: triple pycnocline + halocline + thermocline + dual cabbeling cross-coupling introducing mixed scales 24m Smix24=Hs*Ts/(Hs+Ts) and 22.5m Smix22_5=Mid*Hs/(Mid+Hs) plus depth-dependent thermal coupling gamma0*tAnom*(1+gDepth*z) introducing z*exp term in pressure integral, 24 constants (CabbelingCoeff 0.06, HullThermalExpansionQuadCoeff 1.2e-6, SoundSpeedPressureQuadCoeff 1.2e-5, ThermobaricCoeff 0.5, ThermalCouplingCoeff 0.15, GammaDepthFactor 0.0001), density rho0+grad*z+3 pycno+beta*sAnom+gamma0*tAnom*(1+gDepth*z)+Cc*sAnom*tAnom+Cc*pyc3*sAnom, gradient matches central diff h=0.05 tol 5e-5, second derivative, third derivative, cabbeling parameter, spiciness, sound speed quad, gradient analytic, SOFAR axis scanning 1000+ternary, pycnocline max gradient scanning, potential density rho-grad*z, potential temperature second-order theta=T*(1 -x -0.5*x^2), Brunt-Vaisala, Turner angle, double-diffusive regime, pressure analytic with quadratic 0.5*grad*z^2+0.5*gamma0*gDepth*12*z^2+5 base exps+Smix24+Smix22_5+z*exp Ts*z*exp, steric height (P/g -rho0*z)/rho0, hull volume with quad thermal V0*exp(-kP)*(1+alpha*dT+alpha2*dT^2). Step2: simple Re table Cd 1.2/0.5/0.2, fixed RK4 5% tol, terminal bisection, multi-root equilibrium scanning 0.5m, bounded worker-pool fleet 20 order preserved with context cancellation."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "RK4", "concurrency", "pycnocline", "triple-pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "turner-angle", "salinity", "sound-speed", "potential-density", "second-derivative", "reynolds", "multi-root", "worker-pool", "cabbeling", "SOFAR", "spiciness", "steric-height", "mixed-exponential", "depth-dependent-gamma", "third-derivative"]
