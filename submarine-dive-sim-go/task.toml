schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "HARD Step1 34 constants (26 core + 8: SecondOrderCabbelingCoeff 0.015, TripleCabbelingCoeff 0.004, ThermostericAnomalyCoeff 0.0008, HalostericAnomalyCoeff 0.0003, AdiabaticLapseRate 0.0002, VorticityMixingCoeff 0.00005, DoubleDiffusiveMixingScale 18, PressureNonLinearCoeff 1.5e-6), density 19 terms rho0+grad*z+3 pycno+beta*s+gamma*t*(1+Gamma*z)+4 cab+2 quad+2 cubic s2t st2+2 triple+thermo+halo+vort, 15 exponential scales (200,45,90,30,120,24,22.5,26.08,32.72,75,18,15.65,21.42,13.33,20,15,60,18) plus z*exp and z*product integrals via generic subset enumeration 2^k up to 8 masks, pressure 18-term analytic integralProduct, Simpson 200k rel 1e-5 missing any >20, derivatives up to 3rd analytic via mul2 h=0.001 tol 1e-7/1e-6/1e-5, cabbeling includes second-order+triple, sound speed with P*T coupling only (no depth-cubed/T3/S3/Quad*T*S/P2*T/z*P), gradient 7 terms, potential temp 3rd order x3 + z lapse, steric simple, volume simple, bulk modulus simple K=1/k, 4 finders via 2000 pts Brent 100 iter SOFAR/pycnocline/spice/double-diffusive, N2 acoustic correction g/rho*(drho/dz - rho*g/c2), PV, Turner, regime, spiciness curvature. Step2 HARD 10-pt Re log-interp Cd table, implicit terminal Brent coupled Cd(Re(v)), equilibrium 2000 pts Brent 150 iter stability FPrime<0, adaptive Dormand-Prince RK45 atol 1e-6 rtol 1e-5 PI control with independent reference integrator (not self-comparison), dive profile ComputeDiveProfile, priority fleet heap by effective density + bounded pool 4 + atomic max concurrency with behavioral checks, deadline 50ms for 300 items and cancellation during flight 30ms (relaxed from 20ms/5ms flaky)."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "RK4", "concurrency", "pycnocline", "triple-pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "turner-angle", "salinity", "sound-speed", "potential-density", "third-derivative", "reynolds", "multi-root", "worker-pool", "cabbeling", "SOFAR", "spiciness", "steric-height", "mixed-exponential", "depth-dependent-gamma", "explicit-mapping", "closed-form-pressure", "subset-enumeration"]
