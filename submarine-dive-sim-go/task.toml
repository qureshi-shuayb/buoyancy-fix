schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "EASY Step1 12 constants (Tolerance 1e-9, Gravity 9.81, SeawaterDensity 1025, DepthGrad 0.02, MinVol 0.1, PycDelta 10/Scale 200, Halo 2.5/30, ThermoScale 120, SalinityCoeff 0.8, Bulk 2.2e9), density 3 terms rho0+grad*z+pyc1 where pyc1=10*(1-exp(-z/200)), 1 scale (200) single-scale integral only, pressure 3-term analytic ∫(1-exp)=z+S*exp-S, Simpson 20k rel 1e-2 missing >2, derivatives 1st only h=0.001 tol 1e-4, sound 3 terms c=1449.2+4.6T+0.016z where T=15-12*(1-exp(-z/120)), gradient 2 terms, pot temp 1st order T*(1-x) where x=P/Bulk*1e-3, steric simple, volume simple exp(-kP) clamped 0.1 no thermal, bulk K=1/k, 1 finder SOFAR via 100pts 50iter brute 2m tol 10m, N² simple g/rho*grad. Step2 MEDIUM 5-pt Re Cd table [1e3,1e4,1e5,1e6,5e6] Cd [1.44,1.2,0.7,0.2,0.12] log-interp band 0.1 midpoint 0.05, terminal Brent 50iter 1e-2, equilibrium 500pts 50iter root 5m tol, fixed RK4 k1..k4 only + optional adaptive atol/rtol with independent ref 25%, dive profile len>3 depth tol 5%, priority heap + bounded pool 4 + atomic any width/style (AddInt32/64, Uint, typed) behavioral <=4, deadline 500ms/50items lenient, cancellation 200ms/50items lenient, R05 leak fixed: test.sh removes *_test.go before and after."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "concurrency", "pycnocline", "halocline", "thermocline", "salinity", "sound-speed", "potential-density", "first-derivative", "reynolds", "multi-root", "worker-pool", "SOFAR", "steric-height", "closed-form-pressure", "easy", "information-isolation-fix", "atomic-alternatives"]
