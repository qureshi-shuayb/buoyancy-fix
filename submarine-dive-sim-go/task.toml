schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "EASY-MEDIUM Step1 24 constants (Pycnocline 10/200, Deep 4.5/45, Halo 2.5/30, Thermo 120, HullExp 2e-4, Visc 0.001, Salinity 0.8, Bulk 2.2e9, Cab 0.06, HullQuad 1.2e-6, SoundQuad 1.2e-5, Thermobaric 0.5, ThermalCoupling 0.15, Gamma 0.0001, Tquad 0.002, Squad 0.01), density 9 terms rho0+grad*z+2 pycno+beta*s+gamma*t*(1+Gamma*z)+Cc*s*t+Tquad*t²+Squad*s², 8 scales (200,45,30,120,24,15,60) plus single and 2-scale product integrals and squared terms and z*exp, pressure 10-term analytic integralProduct 4 masks, Simpson 100k rel 1e-4 missing any >10, derivatives up to 2nd analytic h=0.001 tol 1e-6/1e-5, cab 3 terms Cc*s*t+Tquad*t²+Squad*s², sound 5 terms c=1449.2+4.6T-0.055T²+1.34(S-35)+0.016z+SSq*z² no P or T*S coupling, gradient 4 terms, potential temp 2nd order x² only, steric simple, volume simple exp(-kP)*(1+alpha dT+alpha2 dT²), bulk K=1/k, 2 finders via 1000 pts Brent 80 iter SOFAR/pycno max, N² acoustic g/rho*(drho/dz - rho*g/c²), PV. Step2 MEDIUM-HARD 10-pt Re log-interp Cd band 0.1 midpoint 0.05, implicit terminal Brent 80 iter 1e-3, equilibrium 1000 pts 80 iter root 3m tol, fixed RK4 + optional adaptive RK45 atol 1e-6 rtol 1e-5 with independent ref 15% (was 8%), dive profile len>5 tol 2%, priority fleet heap + bounded pool 4 + atomic any width/style (AddInt32/64, Uint, typed atomic.Int32/64) with behavioral concurrency <=4, deadline 200ms/100items lenient, cancellation 100ms/100items. R05 leak fixed: test.sh removes *_test.go and ast_check*.go before and after verifier."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "concurrency", "pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "salinity", "sound-speed", "potential-density", "second-derivative", "reynolds", "multi-root", "worker-pool", "cabbeling", "SOFAR", "spiciness", "steric-height", "mixed-exponential", "closed-form-pressure", "subset-enumeration", "easy-medium", "information-isolation-fix", "atomic-alternatives"]
