schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "Ultra-super-hard Step1 rebalanced significantly harder: Step1 triple pycnocline + halocline + thermocline + cabbeling cross-coupling Cc*(S-35)*(15-T) introducing mixed exponential scale 24m Smix=Hs*Ts/(Hs+Ts) and product-rule differentiation, 22 constants (CabbelingCoeff 0.06, HullThermalExpansionQuadCoeff 1.2e-6, SoundSpeedPressureQuadCoeff 1.2e-5, ThermobaricCoeff 0.5), density 5 exps + mixed scale, gradient with product rule Cab*(dS*tAnom+sAnom*dtAnom), second derivative second product rule, cabbeling parameter, spiciness beta*(S-35)+0.15*(T-15), sound speed with quad pressure term c=1449.2+4.6T-0.055T^2+1.34(S-35)+0.016z+quad*z^2, sound speed gradient analytic 4.6*dT-0.11*T*dT+1.34*dS+0.016+2quad*z, SOFAR axis finder scanning 1000 + ternary bisection, potential density with cabbeling, potential temperature second-order theta=T*(1 -P/K*1e-3 -0.5*(P/K*1e-3)^2), Brunt-Vaisala, Turner angle, double-diffusive regime classification, pressure analytic quadratic+5 exps+mixed Smix term Cab*HD*12*[z+Hs*(expH-1)+Ts*(expT-1)+Smix*(1-expMix)], steric height (P/g -rho0*z)/rho0 analytic includes mixed, hull volume with quad thermal V0*exp(-kP)*(1+alpha*dT+alpha2*dT^2). Step2 easier: simple Re table Cd 1.2/0.5/0.2, fixed RK4 5% tol, terminal bisection, multi-root equilibrium scanning 0.5m, bounded worker-pool fleet 20 order preserved with context cancellation."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "RK4", "concurrency", "pycnocline", "triple-pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "turner-angle", "salinity", "sound-speed", "potential-density", "second-derivative", "reynolds", "multi-root", "worker-pool", "cabbeling", "SOFAR", "spiciness", "steric-height", "product-rule", "mixed-exponential"]
