schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "Ultra-hard two-step submarine simulator: dual exponential pycnocline stratification (shallow + deep halocline), thermocline temperature dependent hull thermal contraction, hydrostatic integral with quadratic + dual-exponential terms, exponential hull with thermal coupling, density gradient and Brunt-Vaisala frequency, Clift-Gauvin continuous drag with logistic crisis, added mass 0.5*rho*V, adaptive RK4 step-doubling with error control, implicit bistable terminal velocity via scanning + bisection, multi-root equilibrium scanning + stability classification, context-aware bounded worker-pool fleet with cancellation."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "RK4", "concurrency", "pycnocline", "dual-pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "reynolds", "clift-gauvin", "drag-crisis", "added-mass", "adaptive-rk4", "multi-root", "stability", "context-cancellation", "worker-pool"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

[metadata]
author_name = "Shuayb Qureshi"
author_email = "shuaybqureshi@meta.com"
difficulty = "hard"
category = "iterate_on_feature"
category_usecase = "compute_result"
category_subdomain = "scientific_computing"
expert_time_estimate_min = 240.0
junior_time_estimate_min = 480.0
reward_type = "binary"
tags = ["multi-turn", "context-following", "submarine", "physics", "go", "simulator", "numerical-methods", "root-finding", "RK4", "concurrency", "hydrostatics", "drag", "pycnocline", "dual-pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "reynolds", "clift-gauvin", "drag-crisis", "added-mass", "adaptive-rk4", "implicit-solving", "multi-root", "stability", "context-cancellation", "worker-pool", "exponential-hull"]
languages = ["go"]

