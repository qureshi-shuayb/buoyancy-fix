tags = ["multi-turn", "context-following", "submarine", "physics", "go", "simulator", "numerical-methods", "root-finding", "RK4", "concurrency", "hydrostatics", "drag", "pycnocline", "triple-pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "salinity", "sound-speed", "potential-density", "second-derivative", "turner-angle", "reynolds", "multi-root", "worker-pool", "exponential-hull"]
languages = ["go"]

