schema_version = "1.1"

[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "Rebalanced ultra-super-hard Step1 / easier Step2 submarine simulator: Step1 triple pycnocline + deep halocline salinity + thermocline temperature with T/S density coupling (beta 0.8, gamma 0.15), 18 constants, 5 exponentials in density, analytic gradient, second derivative, salinity gradient, temperature gradient, sound speed with SOFAR minimum, potential density with bulk modulus, potential temperature, Brunt-Vaisala frequency, Turner angle, hydrostatic integral quadratic + 5 exponentials, exponential hull with thermal contraction. Step2 easier: simple Re table Cd 1.2/0.5/0.2, fixed RK4 5% tolerance, implicit terminal bisection, multi-root equilibrium scanning 0.5m, bounded worker-pool fleet 20 order preserved with simple context cancellation."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["go", "submarine", "buoyancy", "archimedes", "simulator", "physics", "scientific_computing", "numerical-methods", "root-finding", "RK4", "concurrency", "pycnocline", "triple-pycnocline", "halocline", "thermocline", "thermal-expansion", "brunt-vaisala", "turner-angle", "salinity", "sound-speed", "potential-density", "second-derivative", "reynolds", "multi-root", "worker-pool"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
language = "go"

[metadata]
author_name = "Shuayb Qureshi"
author_email = "shuaybqureshi@meta.com"
difficulty = "hard"
category = "iterate_on_feature"
category_usecase = "compute_result"
category_subdomain = "scientific_computing"
expert_time_estimate_min = 320.0
