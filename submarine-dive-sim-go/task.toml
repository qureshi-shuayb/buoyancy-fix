[task]
name = "shuaybqureshi/submarine-dive-sim-go"
description = "VERY EASY Step1 6 constants (Tolerance 1e-9, Gravity 9.81, SeawaterDensity 1025, DepthGrad 0.02, MinVol 0.1, Bulk 2.2e9), density 2 terms rho0+grad*z linear no exp, pressure 2-term analytic g*(rho0*z+0.5*grad*z^2) no exp, Simpson 20k rel 1e-2 missing >2, derivatives 1st only constant grad h=0.001 tol 1e-4, sound quadratic 3 terms c=1500-0.1z+0.0002z² min at 250m no T/S no exp gradient -0.1+0.0004z, pot temp 1st order T*(1-x) where T linear 15-0.02z and x=P/Bulk*1e-3, N² simple g/rho*grad, volume simple exp(-kP) clamped 0.1 no thermal, bulk K=1/k, 1 finder SOFAR quadratic via 100pts 50iter brute 2m tol 10m. Previous 8 consts 2-term still 0/10 Avocado (v3 24 consts 9-term, v4 15 consts 5-term, v5 12 consts 3-term). This v7 ultra-trivial with linear density no exp, gradient constant, pressure 2-term, sound quadratic, should target 10-30% fail rate (70-90% pass). Step2 EASY 5-pt Re Cd [1e3,1e4,1e5,1e6,5e6] Cd [1.44,1.2,0.7,0.2,0.12] log-interp band 0.1 midpoint 0.05, terminal 50iter 1e-2, equilibrium 500pts 50iter root 5m, fixed RK4 k1..k4 + optional adaptive atol/rtol ref 25%, DiveProfile len>3 depth 5%, heap+atomic any width/style (Int32/64, typed) behavioral <=4, deadline 500ms/50 lenient, cancel 200ms/50 lenient, R05 leak fixed rm before+after."
