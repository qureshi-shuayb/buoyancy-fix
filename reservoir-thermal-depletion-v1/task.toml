schema_version = "1.1"

[task]
name = "codimango/reservoir-thermal-depletion-v1"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement lumped 0D geothermal reservoir thermal depletion ODE with explicit Euler hardened v2. Model rock heat capacity, porosity, volume, reinjection and production mass flows as mandatory time series lists, linear plus Stefan-Boltzmann radiative heat loss to ambient, trapezoidal lifetime integral, linear interpolation breakthrough. Return temperature trajectory, thermal breakthrough year interpolated, lifetime extracted energy MWh trapezoidal, average temperature, Q_loss_trajectory, power_output_MW, cumulative_energy_MWh. Deterministic numeric grading against independent reference; naive implementations ignoring radiative heat loss, treating m_in/m_out as scalar, using start-of-step integral instead of trapezoidal, omitting rock thermal mass, wrong Euler order, or discrete breakthrough without interpolation drift past tightened tolerances v3."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["python", "geothermal", "reservoir", "thermal-depletion", "lumped-parameter", "ode", "explicit-euler", "energy-balance", "simulation", "renewable-energy", "radiative-heat-loss", "trapezoidal", "interpolation"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
category_usecase = "compute_result"
category_subdomain = "scientific_computing"
expert_time_estimate_min = 75.0
junior_time_estimate_min = 200.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

