schema_version = "1.1"

[task]
name = "codimango/truss-geometry-validator"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement a pure-Python truss topology validator that parses JSON truss definitions, checks static determinacy via m+r vs 2j counts, detects coincident joints and zero-length members, and builds adjacency and DOF mapping matrices. Foundation for structural mechanics workflow."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["python", "structural-engineering", "truss", "statics", "determinacy", "topology", "graph", "civil-engineering", "mechanics"]

[metadata]
difficulty = "medium"
category = "feature-implementation"
category_usecase = "Simulation & Modeling"
category_subdomain = "Civil Engineering"
expert_time_estimate_min = 40.0
junior_time_estimate_min = 100.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
