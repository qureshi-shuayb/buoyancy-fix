schema_version = "1.1"

[task]
name = "codimango/truss-geometry-validator-ruby"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement a pure-Ruby space truss topology validator that parses JSON truss definitions, checks static determinacy via m+r vs 3j counts in 3D, detects coincident joints and zero-length members with Euclidean 3D distance, and builds adjacency and 3-DOF-per-joint mapping matrices. Foundation for structural mechanics workflow."
authors = [{name = "Shuayb Qureshi", email = "shuaybqureshi@meta.com"}]
keywords = ["ruby", "structural-engineering", "truss", "statics", "determinacy", "topology", "graph", "civil-engineering", "mechanics", "3d", "space-truss", "spatial"]

[metadata]
difficulty = "hard"
category = "feature-implementation"
category_usecase = "compute_result"
category_subdomain = "scientific_computing"
expert_time_estimate_min = 60.0
junior_time_estimate_min = 150.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
